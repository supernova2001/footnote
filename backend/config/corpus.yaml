# What Footnote ingests, and under which licence. Everything here is either in the US public
# domain (published 1930 or earlier) or openly licensed (CC BY / CC BY-SA / CC0). Nothing is
# scraped: Wikipedia and Wikidata through their APIs, Project Gutenberg through its PGLAF mirror
# and published catalogue feed, papers through the Europe PMC REST API.
#
# Names and life years come from the Gutenberg catalogue's author records; Wikidata (CC0)
# overrides the years when the bio is fetched. Every id below was checked against the live
# source on 2026-11-18 (Gutenberg catalogue feed, Wikipedia API, Europe PMC search). The ingest re-checks each one and refuses a mismatch: a
# Gutenberg text must carry the US public-domain notice, a paper must carry a CC BY or CC0 licence.

scholars:
