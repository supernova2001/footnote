# Open-access research papers for the writer agent ("turn this paper into a story for grade 8").
# The query runs once; the PMC ids it picked are frozen in corpus.lock.json so the corpus, and
# every eval built on it, is reproducible. Delete the lock file to pick again.
papers:
  query: '(TITLE:"reading comprehension" OR TITLE:"literacy" OR TITLE:"vocabulary") AND (LICENSE:"cc by" OR LICENSE:"cc0") AND OPEN_ACCESS:y AND HAS_FT:y AND SRC:MED'
  sort: "CITED desc"
  limit: 12
  max_authors: 8

# Wikipedia sections that are navigation, not prose.
wikipedia_skip_sections: ["See also", "References", "Notes", "Citations", "Sources", "Further reading", "External links", "Bibliography", "Works cited", "Footnotes"]
