[project]
name = "footnote"
version = "0.1.0"
description = "Footnote: RAG and multi-agent research assistant where every sentence carries its source"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=2.10.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "langsmith>=0.15.0",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "openai>=3.55.1",
    "pinecone>=10.3.0",
    "pydantic-settings>=2.16.3",
    "pymongo>=4.20.0",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.7.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[project.scripts]
footnote = "footnote.cli:main"
footnote-api = "footnote.api.app:main"
footnote-mcp = "footnote.mcp_server.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR2004", "PLR0912", "PLC0415", "RUF001", "RUF002", "RUF003", "PLW0603", "PLR0911"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B", "RUF", "E501"]
"src/footnote/cli.py" = ["ASYNC230"]  # a one-shot command, not a server: blocking file writes are fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
packages = ["footnote"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
