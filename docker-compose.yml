# Local stack: MongoDB + API + web. Pinecone and Claude are cloud services (keys in .env).
#   docker compose up --build          full stack with your keys
#   FOOTNOTE_OFFLINE=1 docker compose up --build   no keys: fakes + the bundled public-domain snapshot
services:
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      FOOTNOTE_OFFLINE: ${FOOTNOTE_OFFLINE:-0}
      MONGODB_URI: mongodb://mongo:27017
      CORS_ORIGINS: '["http://localhost:3000"]'
      MCP_ALLOWED_HOSTS: '["localhost:8000", "127.0.0.1:8000"]'
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo-data:
