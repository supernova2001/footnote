[project]
name = "footnote-finetune"
version = "0.1.0"
description = "QLoRA fine-tuning of a small open model as Footnote's grounding judge"
requires-python = ">=3.10"
# The default set builds datasets and runs the tests: no torch, no GPU.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Training and evaluation with transformers. Runs on CPU (plain LoRA smoke runs) or a CUDA GPU.
train = [
    "torch>=2.4",
    "transformers>=4.51",   # Qwen3 support
    "peft>=0.15",
    "trl>=0.19",
    "accelerate>=1.6",
    "datasets>=3.5",
]
# 4-bit QLoRA. bitsandbytes needs a CUDA GPU (a free Kaggle/Colab T4 is enough for Qwen3-1.7B).
gpu = [
    "torch>=2.4",
    "transformers>=4.51",
    "peft>=0.15",
    "trl>=0.19",
    "accelerate>=1.6",
    "datasets>=3.5",
    "bitsandbytes>=0.45",
]
# Fast batch generation of model-written claims with an open-weight model. Linux + CUDA only.
generate = ["vllm>=0.9; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8", "nbformat>=5.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
# Generated by notebooks/build_notebook.py; lint the generator, not its output.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# prose fixtures and copy-paste command lines in docstrings read better unwrapped
"footnote_ft/demo_corpus.py" = ["E501"]
"tests/*" = ["E501"]
"eval_judge.py" = ["E501"]
"export/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
