# Larger judge: Qwen3-4B (Apache-2.0). Fits a T4 in 4-bit with batch 2.
model: Qwen/Qwen3-4B
chat_template_kwargs:
  enable_thinking: false

data:
  train: data/out/train.jsonl
  val: data/out/val.jsonl
  max_length: 2048

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  epochs: 2
  max_steps: -1
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 2
  gradient_accumulation: 8     # effective batch 16
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  seed: 13
  report_to: none

output_dir: outputs/qwen3-4b-judge

hub:
  push: false
  repo_id: null
  private: true
