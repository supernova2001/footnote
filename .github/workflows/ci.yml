name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    env:
      FOOTNOTE_OFFLINE: "1"
      MONGODB_URI_TEST: mongodb://localhost:27017   # runs the repo contract tests against real MongoDB
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.9" }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  finetune:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: finetune } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.9" }
      - run: uv sync --frozen
      - run: uvx ruff@0.17.5 check .
      - run: uvx ruff@0.17.5 format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
